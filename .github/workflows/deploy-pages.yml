name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "data/**"
      - "docs/SCORING_MODEL.md"
      - "scripts/**"
      - "test/**"
      - "fixtures/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    outputs:
      build_s: ${{ steps.release.outputs.build_s }}
      upload_s: ${{ steps.upload.outputs.upload_s }}
      release_started: ${{ steps.release.outputs.release_started }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Start release timing
        run: echo "RELEASE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate factory contracts
        run: |
          ./scripts/check-local.sh
          node --test
          node --check dashboard/app.js
          node --check dashboard/project.js

      - name: Start build timing
        run: echo "BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build static dashboard artifact
        run: node scripts/build-public-dashboard.mjs --output _site

      - name: Record exact release identity and build timing
        id: release
        run: |
          node scripts/release-passport.mjs write _site
          echo "build_s=$(( $(date +%s) - BUILD_STARTED ))" >> "$GITHUB_OUTPUT"
          echo "release_started=$RELEASE_STARTED" >> "$GITHUB_OUTPUT"

      - name: Start artifact upload timing
        run: echo "UPLOAD_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Record artifact upload timing
        id: upload
        run: echo "upload_s=$(( $(date +%s) - UPLOAD_STARTED ))" >> "$GITHUB_OUTPUT"

  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout release verification tool
        uses: actions/checkout@v4

      - name: Set up verification runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify the published commit and homepage
        env:
          RELEASE_UPLOAD_SECONDS: ${{ needs.build.outputs.upload_s }}
          RELEASE_BUILD_SECONDS: ${{ needs.build.outputs.build_s }}
          RELEASE_STARTED: ${{ needs.build.outputs.release_started }}
        run: node scripts/release-passport.mjs verify "${{ steps.deployment.outputs.page_url }}" "$GITHUB_SHA"
